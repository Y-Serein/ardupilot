name: Copter unit tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copter-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ardupilot/ardupilot-dev-base:v0.1.3
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Compile unit tests in a separate output directory
        run: |
          python3 waf configure --board sitl --out=build/unit-tests --no-submodule-update --debug
          python3 waf tests

      - name: Run unit test executables
        run: |
          shopt -s nullglob
          tests=(build/unit-tests/sitl/tests/*)
          if (( ${#tests[@]} == 0 )); then
            echo 'No unit test executables were produced.' >&2
            exit 1
          fi
          failed=0
          for unit_test in "${tests[@]}"; do
            printf 'Running %s\n' "$unit_test"
            timeout 120 "$unit_test" || failed=1
          done
          exit "$failed"
