name: Copter SITL build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copter-sitl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitl:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ardupilot/ardupilot-dev-base:v0.1.3
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build Copter SITL
        run: |
          python3 waf configure --board sitl --out=build/sitl-product --no-submodule-update --disable-tests
          python3 waf copter

      - name: Check SITL output
        run: test -s build/sitl-product/sitl/bin/arducopter
